<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>のみもの在庫ノート</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

:root{
  --cream: #FFFBF3;
  --card: #FFFFFF;
  --peach: #FFB4A2;
  --peach-dark: #F98C74;
  --mint: #A8D8B9;
  --mint-dark: #4E9A6C;
  --amber: #FFD166;
  --amber-dark: #B8860B;
  --coral: #F4777F;
  --coral-dark: #D14B54;
  --sky: #BEE3F0;
  --text: #5C4B41;
  --text-soft: #9C8B7E;
  --shadow: 0 6px 18px rgba(92,75,65,0.10);
}

*{ box-sizing: border-box; }

body{
  margin:0;
  font-family: 'M PLUS Rounded 1c', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

.app{
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 110px;
  position: relative;
}

/* ---- Header ---- */
.hero{
  background: linear-gradient(160deg, #FFD9C7 0%, #FFECD9 55%, var(--cream) 100%);
  padding: 28px 20px 34px;
  border-radius: 0 0 32px 32px;
  position: relative;
  overflow: hidden;
}
.hero-title{
  font-size: 24px;
  font-weight: 800;
  margin: 0;
  display:flex;
  align-items:center;
  gap:8px;
}
.hero-sub{
  font-size: 13px;
  color: var(--text-soft);
  margin: 6px 0 0;
}
.hero-blob{
  position:absolute;
  border-radius:50%;
  opacity:0.5;
}
.hero .b1{ width:70px; height:70px; background:#fff; top:-20px; right:30px; opacity:0.35;}
.hero .b2{ width:34px; height:34px; background:#fff; bottom:10px; right:90px; opacity:0.4;}

.summary-row{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.summary-pill{
  flex:1;
  background: rgba(255,255,255,0.75);
  border-radius: 16px;
  padding: 10px 12px;
  text-align:center;
  backdrop-filter: blur(2px);
}
.summary-pill .num{
  font-size:20px;
  font-weight:800;
  display:block;
  line-height:1.1;
}
.summary-pill .lbl{
  font-size:11px;
  color: var(--text-soft);
}
.summary-pill .num small{
  font-size:12px;
  font-weight:700;
  margin-left:1px;
}
.summary-pill .lbl{ display:block; }
.pill-detail{
  margin-top:6px;
  padding-top:6px;
  border-top:1px dashed rgba(0,0,0,0.12);
  font-size:10.5px;
  line-height:1.5;
  color: var(--text);
  text-align:left;
}
.pill-detail .row{
  display:flex;
  justify-content:space-between;
  gap:4px;
}
.pill-detail .row .n{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pill-detail .row .q{ font-weight:800; flex-shrink:0; }
.pill-detail .none{ color: var(--text-soft); text-align:center; }
.summary-row{ align-items:stretch; }
.summary-pill.warn .num{ color: var(--amber-dark); }
.summary-pill.bad .num{ color: var(--coral-dark); }
.summary-pill.ok .num{ color: var(--mint-dark); }

/* ---- Alert banner ---- */
.alert-banner{
  margin: -14px 16px 6px;
  background: #FFF3D6;
  border: 1.5px solid #FFDF94;
  border-radius: 18px;
  padding: 12px 14px;
  font-size: 13px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow: var(--shadow);
}
.alert-banner .icon{ font-size: 22px; flex-shrink:0; }
.alert-banner b{ color: var(--amber-dark); }

.count-row{
  display:flex;
  gap:10px;
  padding: 14px 16px 4px;
  overflow-x:auto;
}
.count-chip{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
  background: var(--card);
  border: 1.5px solid #EADFD2;
  border-radius: 14px;
  padding: 6px 12px 6px 6px;
  box-shadow: var(--shadow);
}
.count-chip-icon{
  width:26px; height:26px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.count-chip-icon svg{ width:18px; height:18px; }
.count-chip-name{ font-size:13px; font-weight:700; white-space:nowrap; }
.count-chip-num{ font-size:13px; font-weight:800; }

/* ---- List ---- */
.list{
  padding: 16px 16px 0;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.empty-state{
  text-align:center;
  padding: 60px 30px;
  color: var(--text-soft);
}
.empty-state .emoji{ font-size:44px; display:block; margin-bottom:10px; }
.empty-state p{ font-size:14px; line-height:1.7; margin:0; }

.card{
  background: var(--card);
  border-radius: 20px;
  padding: 14px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  box-shadow: var(--shadow);
  border: 1.5px solid transparent;
  animation: pop 0.35s ease;
}
@keyframes pop{
  from{ opacity:0; transform: translateY(6px) scale(0.98); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}
.card.expired{ border-color: #F9C4C7; }

.icon-wrap{
  width: 52px;
  height: 52px;
  border-radius: 16px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  position: relative;
}
.icon-wrap svg{ width:32px; height:32px; }

.qty-badge{
  position:absolute;
  top:-8px;
  right:-8px;
  background: var(--peach-dark);
  color:#fff;
  font-size:12px;
  font-weight:800;
  min-width:24px;
  height:24px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px;
  box-shadow:0 3px 7px rgba(249,140,116,0.45);
  border:2.5px solid var(--card);
}

.card-body{ flex:1; min-width:0; }
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:6px;
}
.drink-name{
  font-size:16px;
  font-weight:700;
  margin:0;
}
.badge{
  font-size:11px;
  font-weight:700;
  padding: 4px 9px;
  border-radius: 999px;
  white-space:nowrap;
  flex-shrink:0;
}
.badge.ok{ background:#E4F5E9; color: var(--mint-dark); }
.badge.warn{ background:#FFF3D6; color: var(--amber-dark); }
.badge.bad{ background:#FDE4E5; color: var(--coral-dark); }

.card-meta{
  display:flex;
  flex-wrap:wrap;
  gap: 6px 10px;
  margin-top: 8px;
  font-size:12px;
  color: var(--text-soft);
}
.card-meta span{ display:flex; align-items:center; gap:4px; }

.card-actions{
  display:flex;
  gap:6px;
  margin-top:2px;
  flex-shrink:0;
}
.icon-btn{
  width:28px; height:28px;
  border-radius:50%;
  border:none;
  background:#F5EFE8;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  font-size:13px;
  color: var(--text-soft);
}
.icon-btn:active{ transform: scale(0.9); }

/* ---- FAB ---- */
.fab{
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(calc(-50% + 165px));
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(150deg, var(--peach), var(--peach-dark));
  border:none;
  color:#fff;
  font-size: 28px;
  box-shadow: 0 10px 20px rgba(249,140,116,0.45);
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  z-index: 20;
}
.fab:active{ transform: translateX(calc(-50% + 165px)) scale(0.92); }

/* ---- Sheet ---- */
.overlay{
  position: fixed; inset:0;
  background: rgba(92,75,65,0.35);
  z-index: 30;
  opacity:0;
  pointer-events:none;
  transition: opacity 0.25s ease;
}
.overlay.show{ opacity:1; pointer-events:auto; }

.sheet{
  position: fixed;
  left:0; right:0; bottom:0;
  max-width: 480px;
  margin: 0 auto;
  background: var(--cream);
  border-radius: 26px 26px 0 0;
  padding: 18px 20px 24px;
  z-index: 31;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(.2,.9,.3,1);
  max-height: 88vh;
  overflow-y:auto;
}
.sheet.show{ transform: translateY(0); }
.sheet-handle{
  width:38px; height:5px; border-radius:3px;
  background:#E7DCCF; margin: 0 auto 14px;
}
.sheet h2{ font-size:18px; margin: 0 0 16px; }

.field{ margin-bottom:16px; }
.field label{
  font-size:12px; font-weight:700; color: var(--text-soft);
  display:block; margin-bottom:6px;
}
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.chip{
  border: 1.5px solid #EADFD2;
  background:#fff;
  border-radius: 999px;
  padding: 7px 13px;
  font-size:13px;
  font-family: inherit;
  color: var(--text);
  cursor:pointer;
  display:flex; align-items:center; gap:6px;
}
.chip.selected{
  background: var(--peach);
  border-color: var(--peach);
  color:#fff;
  font-weight:700;
}
.field input[type="text"], .field input[type="date"]{
  width:100%;
  border: 1.5px solid #EADFD2;
  background:#fff;
  border-radius: 14px;
  padding: 11px 13px;
  font-size:15px;
  font-family:inherit;
  color: var(--text);
}
.field input:focus{ outline:none; border-color: var(--peach); }

.sheet-actions{ display:flex; gap:10px; margin-top:6px; }
.btn{
  flex:1;
  border:none;
  border-radius: 16px;
  padding: 13px;
  font-size:15px;
  font-weight:700;
  font-family:inherit;
  cursor:pointer;
}
.btn-primary{ background: var(--peach-dark); color:#fff; }
.btn-primary:active{ transform: scale(0.98); }
.btn-secondary{ background:#F0E7DB; color: var(--text); }

.confirm-box{
  background:#fff;
  border-radius:20px;
  padding:20px;
  text-align:center;
  max-width:300px;
  margin: 0 auto;
}
.confirm-box p{ font-size:14px; margin: 8px 0 18px; }
.confirm-box .row{ display:flex; gap:10px; }

.loading-screen{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height: 70vh; gap:12px; color: var(--text-soft); font-size:13px;
}
.loading-screen .spin{
  font-size: 34px;
  animation: bounce 1s ease-in-out infinite;
}
@keyframes bounce{
  0%,100%{ transform: translateY(0); }
  50%{ transform: translateY(-10px); }
}

.toast{
  position: fixed;
  bottom: 100px;
  left:50%;
  transform: translateX(-50%);
  background: var(--text);
  color:#fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size:13px;
  z-index: 40;
  opacity:0;
  transition: opacity 0.25s ease;
  pointer-events:none;
}
.toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading-screen" id="loadingScreen">
    <div class="spin">🥤</div>
    <div>よみこみちゅう…</div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){

  const PRESET_DRINKS = [
    { name: '麦茶', color: '#EFE0C4', dark: '#B8925B' },
    { name: 'アクエリ', color: '#CDE9F6', dark: '#4A9DC4' },
    { name: 'トロピカーナ', color: '#FFE0B5', dark: '#F08A2C' },
    { name: 'OS-1', color: '#DCEEDD', dark: '#6BAE7A' },
  ];
  const PRESET_PLACES = ['自宅', '学校倉庫'];
  const EVENT_OPTIONS = ['春季大会', '夏季大会', '新人大会', '秋季大会'];

  const PANTRY_KEY = 'pantry-id-v1';
  const BASKET_NAME = 'drinks-club';

  let drinks = [];
  let history = [];
  let editingId = null;
  let pendingDeleteId = null;
  let formIcon = PRESET_DRINKS[0];
  let pantryId = null;
  let lastLoadFailed = false;

  const app = document.getElementById('app');
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  const toastEl = document.getElementById('toast');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  let toastTimer = null;
  function showToast(msg, ms){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), ms || 1800);
  }
  function errMsg(base){
    // 理由も出して、長めに表示する
    setTimeout(()=> showToast(`${base}（${lastError || '理由不明'}）`, 6000), 0);
    return `${base}（${lastError || '理由不明'}）`;
  }

  function daysUntil(dateStr){
    const today = new Date();
    today.setHours(0,0,0,0);
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }

  function statusOf(days){
    if(days < 0) return 'bad';
    if(days <= 30) return 'warn';
    return 'ok';
  }

  function statusLabel(days){
    if(days < 0) return `期限切れ（${Math.abs(days)}日前）`;
    if(days === 0) return '今日まで！';
    if(days <= 30) return `あと${days}日`;
    return `あと${days}日`;
  }

  function iconFor(name){
    const found = PRESET_DRINKS.find(d => d.name === name);
    if(found) return found;
    // deterministic pastel color for custom names
    const palette = [
      {color:'#E6D9F2', dark:'#8C6DB8'},
      {color:'#FDE0E0', dark:'#D9797C'},
      {color:'#DDEEDD', dark:'#6FAE83'},
      {color:'#FDEBC8', dark:'#D6994A'},
    ];
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return { name, ...palette[Math.abs(hash) % palette.length] };
  }

  function svgFor(name){
    // simple cute glass/bottle svg, tinted by icon color
    const ic = iconFor(name);
    if(name === '麦茶'){
      return `<svg viewBox="0 0 48 48"><path d="M14 10h20l-2 26a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4L14 10z" fill="${ic.color}" stroke="${ic.dark}" stroke-width="2"/><path d="M14 10h20" stroke="${ic.dark}" stroke-width="2" stroke-linecap="round"/><ellipse cx="24" cy="22" rx="6" ry="2.5" fill="${ic.dark}" opacity="0.5"/></svg>`;
    }
    if(name === 'アクエリ'){
      return `<svg viewBox="0 0 48 48"><path d="M19 6h10v6l3 3v25a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V15l3-3V6z" fill="${ic.color}" stroke="${ic.dark}" stroke-width="2"/><rect x="17" y="24" width="14" height="9" rx="2" fill="${ic.dark}" opacity="0.55"/></svg>`;
    }
    if(name === 'トロピカーナ'){
      return `<svg viewBox="0 0 48 48"><rect x="12" y="10" width="24" height="30" rx="3" fill="${ic.color}" stroke="${ic.dark}" stroke-width="2"/><path d="M12 10 L24 18 L36 10" fill="none" stroke="${ic.dark}" stroke-width="2" stroke-linejoin="round"/><circle cx="24" cy="28" r="5" fill="${ic.dark}" opacity="0.5"/></svg>`;
    }
    if(name === 'OS-1'){
      return `<svg viewBox="0 0 48 48"><path d="M18 6h12v8l4 4v20a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V18l4-4V6z" fill="${ic.color}" stroke="${ic.dark}" stroke-width="2"/><path d="M24 22v10M19 27h10" stroke="${ic.dark}" stroke-width="2.5" stroke-linecap="round"/></svg>`;
    }
    // generic cup
    return `<svg viewBox="0 0 48 48"><path d="M14 12h20l-2 24a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4L14 12z" fill="${ic.color}" stroke="${ic.dark}" stroke-width="2"/><path d="M34 16h4a4 4 0 0 1 0 8h-3" fill="none" stroke="${ic.dark}" stroke-width="2"/></svg>`;
  }

  function apiUrl(){
    return `https://getpantry.cloud/apiv1/pantry/${encodeURIComponent(pantryId)}/basket/${BASKET_NAME}`;
  }

  function syncUrlWithPantryId(){
    try{
      const url = new URL(window.location.href);
      if(url.searchParams.get('pid') !== pantryId){
        url.searchParams.set('pid', pantryId);
        window.history.replaceState(null, '', url.toString());
      }
    }catch(e){}
  }

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  // Pantry は短時間に何回も通信すると断られる（回数制限）ので、
  // 通信は1つずつ順番に、前回から少し間隔をあけて送る。断られたら待って再挑戦。
  const MIN_GAP_MS = 1300;
  let lastRequestAt = 0;
  let requestQueue = Promise.resolve();
  function pantryFetch(options){
    const run = async () => {
      let res = null;
      for(let attempt = 0; attempt < 4; attempt++){
        const wait = lastRequestAt + MIN_GAP_MS - Date.now();
        if(wait > 0) await sleep(wait);
        lastRequestAt = Date.now();
        try{
          res = await fetch(apiUrl(), { cache: 'no-store', ...options });
          // 回数制限・サーバー混雑のときだけ再挑戦
          if(res.status !== 429 && res.status < 500) return res;
        }catch(e){
          res = null;
        }
        await sleep(1500 * (attempt + 1));
      }
      if(res) return res;
      throw new Error('network error');
    };
    const p = requestQueue.then(run, run);
    requestQueue = p.catch(()=>{});
    return p;
  }

  let basketMissing = false;
  let lastError = '';
  const APP_VERSION = 'v3';

  async function loadDrinks(){
    try{
      const res = await pantryFetch({ method: 'GET' });
      if(res.status === 400 || res.status === 404){
        // 初回アクセスなど、バスケットがまだ存在しない場合のみ空扱いにする
        drinks = [];
        history = [];
        basketMissing = true;
        lastLoadFailed = false;
        return;
      }
      basketMissing = false;
      if(!res.ok){
        let t = ''; try{ t = (await res.text()).slice(0,60); }catch(e){}
        lastError = `読込${res.status} ${t}`;
        throw new Error('load failed');
      }
      const data = await res.json();
      drinks = Array.isArray(data.drinks) ? data.drinks : [];
      history = Array.isArray(data.history) ? data.history : [];
      lastLoadFailed = false;
    }catch(e){
      // 通信が一瞬失敗しただけかもしれないので、今表示している内容は消さない
      if(!lastError) lastError = '読込:通信エラー ' + (e && e.message || '');
      lastLoadFailed = true;
      showToast('読み込みに失敗したよ。通信環境を確認してね');
    }
  }

  async function loadDrinksWithRetry(){
    await loadDrinks();
    if(lastLoadFailed){
      await loadDrinks();
    }
  }

  async function saveDrinks(){
    try{
      const res = await pantryFetch({
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ drinks, history })
      });
      if(res.ok) return true;
      let t = ''; try{ t = (await res.text()).slice(0,60); }catch(e){}
      lastError = `保存${res.status} ${t}`;
      return false;
    }catch(e){
      lastError = '保存:通信エラー ' + (e && e.message || '');
      return false;
    }
  }

  // 変更の前に必ずサーバーの最新データを読み直してから、変更して保存する。
  // （古い画面のまま保存して、ほかの人が消したものが復活するのを防ぐ）
  let syncing = false;
  async function syncChange(applyFn){
    if(syncing){ lastError = '前の保存がまだ途中'; return false; } // 連打で二重に保存しないように
    syncing = true;
    try{ return await syncChangeInner(applyFn); } finally { syncing = false; }
  }
  async function syncChangeInner(applyFn){
    showToast('保存中…');
    lastError = '';
    const hadData = drinks.length > 0 || history.length > 0;
    await loadDrinksWithRetry();
    if(lastLoadFailed) return false;
    // 「データが空」と返ってきたのに、さっきまでデータがあった場合は
    // 何かおかしいので保存しない（全部消えてしまうのを防ぐ）
    if(basketMissing && hadData){ lastError = 'データが空で返ってきた'; return false; }
    const result = applyFn();
    if(result === false){ lastError = lastError || '対象が見つからない'; return false; }
    const ok = await saveDrinks();
    if(!ok){
      await loadDrinks(); // 失敗したらサーバーの本当の状態に表示を戻す
      return false;
    }
    return true;
  }

  function renderSetup(){
    app.innerHTML = `
      <div class="hero">
        <div class="hero-blob b1"></div>
        <div class="hero-blob b2"></div>
        <p class="hero-title">🥤 のみもの在庫ノート</p>
        <p class="hero-sub">市高野球部⚾</p>
      </div>
      <div class="empty-state" style="text-align:left; padding: 24px 20px;">
        <span class="emoji" style="text-align:center; display:block;">🔗</span>
        <p style="text-align:center; margin-bottom:20px;">みんなで同じリストを<br>見る・更新するために、<br>共有IDをつなげよう。</p>
        <div class="field">
          <label>共有ID（Pantry ID）</label>
          <input type="text" id="pantryInput" placeholder="例：xxxx-xxxx-xxxx-xxxx" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <button class="btn btn-primary" id="connectBtn" style="width:100%;">つなぐ</button>
      </div>
    `;
    document.getElementById('connectBtn').addEventListener('click', handleConnect);
  }

  async function handleConnect(){
    const val = document.getElementById('pantryInput').value.trim();
    if(!val){ showToast('IDを入力してね'); return; }
    pantryId = val;
    try{ window.localStorage.setItem(PANTRY_KEY, pantryId); }catch(e){}
    syncUrlWithPantryId();
    showToast('つないでいるよ…');
    await loadDrinksWithRetry();
    render();
  }

  function openSettings(){
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <h2>共有の設定</h2>
      <div class="field">
        <label>今の共有ID</label>
        <input type="text" id="currentIdInput" value="${escapeHtml(pantryId)}" readonly autocapitalize="none" autocorrect="off" spellcheck="false">
        <button type="button" class="btn btn-secondary" id="copyIdBtn" style="width:100%; margin-top:8px;">IDをコピー</button>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="cancelSettings" style="flex:1;">閉じる</button>
      </div>
    `;
    document.getElementById('cancelSettings').addEventListener('click', closeSheet);
    document.getElementById('copyIdBtn').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(pantryId);
        showToast('コピーしたよ');
      }catch(e){
        showToast('コピーできなかったよ。長押しでコピーしてね');
      }
    });
    overlay.classList.add('show');
    sheet.classList.add('show');
  }

  async function manualRefresh(){
    showToast('更新しているよ…');
    await loadDrinks();
    render();
    showToast('最新にしたよ');
  }

  function render(){
    const sorted = [...drinks].sort((a,b)=> daysUntil(a.expiry) - daysUntil(b.expiry));
    // 状態ごとに「本数」と「飲み物ごとの内訳」を集計
    const byStatus = { ok:{total:0, items:{}}, warn:{total:0, items:{}}, bad:{total:0, items:{}} };
    for(const d of sorted){
      const st = statusOf(daysUntil(d.expiry));
      const q = d.qty || 1;
      byStatus[st].total += q;
      byStatus[st].items[d.name] = (byStatus[st].items[d.name] || 0) + q;
    }
    const okCount = byStatus.ok.total;
    const warnCount = byStatus.warn.total;
    const badCount = byStatus.bad.total;
    const pillDetail = (st) => {
      const entries = Object.entries(byStatus[st].items).sort((a,b)=> b[1]-a[1]);
      if(entries.length === 0) return `<div class="pill-detail"><div class="none">なし</div></div>`;
      return `<div class="pill-detail">${entries.map(([n,q]) =>
        `<div class="row"><span class="n">${escapeHtml(n)}</span><span class="q">${q}本</span></div>`
      ).join('')}</div>`;
    };

    let html = `
      <div class="hero">
        <div class="hero-blob b1"></div>
        <div class="hero-blob b2"></div>
        <div style="position:absolute; top:14px; right:14px; display:flex; gap:8px; z-index:2;">
          <button class="icon-btn" id="refreshBtn" style="background:rgba(255,255,255,0.75); width:32px; height:32px; font-size:15px;">🔄</button>
          <button class="icon-btn" id="historyBtn" style="background:rgba(255,255,255,0.75); width:32px; height:32px; font-size:15px;">📖</button>
          <button class="icon-btn" id="settingsBtn" style="background:rgba(255,255,255,0.75); width:32px; height:32px; font-size:15px;">⚙️</button>
        </div>
        <p class="hero-title">🥤 のみもの在庫ノート</p>
        <p class="hero-sub">市高野球部⚾ <span style="font-size:10px; opacity:0.6;">${APP_VERSION}</span></p>
        <div class="summary-row">
          <div class="summary-pill ok"><span class="num">${okCount}<small>本</small></span><span class="lbl">まだ大丈夫</span>${pillDetail('ok')}</div>
          <div class="summary-pill warn"><span class="num">${warnCount}<small>本</small></span><span class="lbl">もうすぐ期限</span>${pillDetail('warn')}</div>
          <div class="summary-pill bad"><span class="num">${badCount}<small>本</small></span><span class="lbl">期限切れ</span>${pillDetail('bad')}</div>
        </div>
      </div>
    `;

    if(warnCount + badCount > 0){
      html += `
        <div class="alert-banner">
          <span class="icon">⏰</span>
          <div>${badCount > 0 ? `<b>${badCount}本が期限切れ</b>、` : ''}${warnCount > 0 ? `<b>${warnCount}本</b>が1ヶ月以内に期限が来るよ` : ''}</div>
        </div>
      `;
    }

    if(sorted.length > 0){
      const counts = {};
      for(const d of sorted){ counts[d.name] = (counts[d.name] || 0) + (d.qty || 1); }
      const names = Object.keys(counts);
      html += '<div class="count-row">';
      for(const name of names){
        const ic = iconFor(name);
        html += `
          <div class="count-chip" style="border-color:${ic.dark}55;">
            <span class="count-chip-icon" style="background:${ic.color}55;">${svgFor(name)}</span>
            <span class="count-chip-name">${escapeHtml(name)}</span>
            <span class="count-chip-num" style="color:${ic.dark};">×${counts[name]}</span>
          </div>
        `;
      }
      html += '</div>';
      html += `<div style="padding:6px 16px 0;"><button class="btn btn-primary" id="consumeBtn" style="width:100%;">🥤 消費済を記録</button></div>`;
    }

    if(sorted.length === 0){
      if(lastLoadFailed){
        html += `
          <div class="empty-state">
            <span class="emoji">📡</span>
            <p>読み込みに失敗して表示できていない可能性があります。<br>本当に空かどうか分からないので、<br>下のボタンでもう一度試してみてください。</p>
            <button class="btn btn-primary" id="retryLoadBtn" style="margin-top:14px; width:100%;">🔄 もう一度読み込む</button>
          </div>
        `;
      }else{
        html += `
          <div class="empty-state">
            <span class="emoji">🧃</span>
            <p>まだ何も登録されていません。<br>右下の＋ボタンから<br>飲み物を追加してみよう！</p>
          </div>
        `;
      }
    }else{
      html += '<div class="list">';
      for(const d of sorted){
        const days = daysUntil(d.expiry);
        const st = statusOf(days);
        const ic = iconFor(d.name);
        html += `
          <div class="card ${st === 'bad' ? 'expired' : ''}">
            <div class="icon-wrap" style="background:${ic.color}22">${svgFor(d.name)}<span class="qty-badge">${d.qty || 1}</span></div>
            <div class="card-body">
              <div class="card-top">
                <p class="drink-name">${escapeHtml(d.name)}</p>
                <span class="badge ${st}">${statusLabel(days)}</span>
              </div>
              <div class="card-meta">
                <span>📍 ${escapeHtml(d.place || '未設定')}</span>
                <span>🙋 ${escapeHtml(d.buyer || '未設定')}</span>
                <span>📅 ${formatDate(d.expiry)}まで</span>
              </div>
            </div>
            <div class="card-actions">
              <button class="icon-btn" data-edit="${d.id}">✏️</button>
              <button class="icon-btn" data-del="${d.id}">🗑️</button>
            </div>
          </div>
        `;
      }
      html += '</div>';
    }

    html += `<button class="fab" id="fabBtn">＋</button>`;
    app.innerHTML = html;

    app.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.addEventListener('click', ()=> openForm(btn.dataset.edit));
    });
    app.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', ()=> askDelete(btn.dataset.del));
    });
    document.getElementById('fabBtn').addEventListener('click', ()=> openForm(null));
    document.getElementById('refreshBtn').addEventListener('click', manualRefresh);
    document.getElementById('historyBtn').addEventListener('click', renderHistory);
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    const consumeBtn = document.getElementById('consumeBtn');
    if(consumeBtn) consumeBtn.addEventListener('click', openConsumeSheet);
    const retryBtn = document.getElementById('retryLoadBtn');
    if(retryBtn) retryBtn.addEventListener('click', manualRefresh);
  }

  function todayStr(){
    const d = new Date();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${d.getFullYear()}-${m}-${day}`;
  }

  function openConsumeSheet(){
    const totals = {};
    for(const d of drinks){ totals[d.name] = (totals[d.name] || 0) + (d.qty || 1); }
    const names = Object.keys(totals);
    if(names.length === 0){ showToast('在庫がないよ'); return; }

    let selectedName = names[0];

    function bodyHtml(){
      return `
        <div class="sheet-handle"></div>
        <h2>🥤 消費済を記録</h2>
        <div class="field">
          <label>品名</label>
          <div class="chip-row" id="consumeChips">
            ${names.map(n => `<button type="button" class="chip ${n===selectedName ? 'selected' : ''}" data-cname="${escapeHtml(n)}">${escapeHtml(n)}（在庫${totals[n]}）</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>消費した本数</label>
          <input type="number" id="consumeQtyInput" min="1" max="${totals[selectedName]}" step="1" value="${totals[selectedName]}">
        </div>
        <div class="field">
          <label>大会（任意）</label>
          <div class="chip-row" id="eventChips">
            ${EVENT_OPTIONS.map(ev => `<button type="button" class="chip" data-event="${ev}">${ev}</button>`).join('')}
          </div>
          <input type="text" id="eventInput" placeholder="大会名を入力（任意）">
        </div>
        <div class="field">
          <label>消費した日</label>
          <input type="date" id="consumeDateInput" value="${todayStr()}">
        </div>
        <div class="sheet-actions">
          <button class="btn btn-secondary" id="cancelConsume">やめる</button>
          <button class="btn btn-primary" id="confirmConsume">記録する</button>
        </div>
      `;
    }

    function bind(){
      sheet.querySelectorAll('#consumeChips .chip').forEach(chip=>{
        chip.addEventListener('click', ()=>{
          selectedName = chip.dataset.cname;
          sheet.innerHTML = bodyHtml();
          bind();
        });
      });
      sheet.querySelectorAll('#eventChips .chip').forEach(chip=>{
        chip.addEventListener('click', ()=>{
          sheet.querySelectorAll('#eventChips .chip').forEach(c=>c.classList.remove('selected'));
          chip.classList.add('selected');
          document.getElementById('eventInput').value = chip.dataset.event;
        });
      });
      document.getElementById('cancelConsume').addEventListener('click', closeSheet);
      document.getElementById('confirmConsume').addEventListener('click', async ()=>{
        let qty = parseInt(document.getElementById('consumeQtyInput').value, 10);
        if(!qty || qty < 1) qty = 1;
        const consumedDate = document.getElementById('consumeDateInput').value || todayStr();
        const eventVal = document.getElementById('eventInput').value.trim();

        const ok = await syncChange(()=>{
          // 最新データで在庫数を数え直す
          const matching = drinks
            .filter(d => d.name === selectedName)
            .sort((a,b) => (a.expiry || '').localeCompare(b.expiry || ''));
          const available = matching.reduce((sum, d) => sum + (d.qty || 1), 0);
          if(available === 0) return false;
          if(qty > available) qty = available;

          let remaining = qty;
          for(const entry of matching){
            if(remaining <= 0) break;
            const take = Math.min(entry.qty || 1, remaining);
            entry.qty = (entry.qty || 1) - take;
            remaining -= take;
          }
          drinks = drinks.filter(d => (d.qty || 0) > 0);
          history.unshift({ id: uid(), name: selectedName, qty, consumedDate, event: eventVal });
        });
        closeSheet();
        render();
        showToast(ok ? `${selectedName}を${qty}本、消費済に記録したよ` : errMsg('記録できなかったよ'));
      });
    }

    sheet.innerHTML = bodyHtml();
    bind();
    overlay.classList.add('show');
    sheet.classList.add('show');
  }

  function renderHistory(){
    const sorted = [...history].sort((a,b)=> (b.consumedDate || '').localeCompare(a.consumedDate || ''));
    let html = `
      <div class="hero">
        <div class="hero-blob b1"></div>
        <div class="hero-blob b2"></div>
        <div style="position:absolute; top:14px; left:14px; z-index:2;">
          <button class="icon-btn" id="backToListBtn" style="background:rgba(255,255,255,0.75); width:32px; height:32px; font-size:15px;">←</button>
        </div>
        <p class="hero-title">📖 消費履歴</p>
        <p class="hero-sub">飲み終わったものの記録</p>
      </div>
    `;
    if(sorted.length === 0){
      html += `
        <div class="empty-state">
          <span class="emoji">📭</span>
          <p>まだ消費済の記録がありません。<br>リストの「🥤 消費済を記録」から記録できます。</p>
        </div>
      `;
    }else{
      html += '<div class="list">';
      for(const d of sorted){
        const ic = iconFor(d.name);
        html += `
          <div class="card">
            <div class="icon-wrap" style="background:${ic.color}22">${svgFor(d.name)}<span class="qty-badge" style="background:var(--mint-dark);">${d.qty || 1}</span></div>
            <div class="card-body">
              <div class="card-top">
                <p class="drink-name">${escapeHtml(d.name)}</p>
                <span class="badge ok">消費済</span>
              </div>
              <div class="card-meta">
                <span>✅ ${formatDate(d.consumedDate)}に消費</span>
                ${d.event ? `<span>🏆 ${escapeHtml(d.event)}</span>` : ''}
              </div>
            </div>
            <div class="card-actions">
              <button class="icon-btn" data-histdel="${d.id}">🗑️</button>
            </div>
          </div>
        `;
      }
      html += '</div>';
    }
    app.innerHTML = html;
    document.getElementById('backToListBtn').addEventListener('click', render);
    app.querySelectorAll('[data-histdel]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const hid = btn.dataset.histdel;
        const ok = await syncChange(()=>{
          history = history.filter(d => d.id !== hid);
        });
        renderHistory();
        showToast(ok ? '履歴から削除したよ' : errMsg('削除できなかったよ'));
      });
    });
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00');
    return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
  }

  function closeSheet(){
    sheet.classList.remove('show');
    overlay.classList.remove('show');
    setTimeout(()=>{ sheet.innerHTML=''; }, 300);
  }

  function openForm(id){
    editingId = id;
    const existing = id ? drinks.find(d => d.id === id) : null;
    formIcon = existing ? iconFor(existing.name) : PRESET_DRINKS[0];

    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <h2>${existing ? '飲み物を編集' : '飲み物を追加'}</h2>
      <div class="field">
        <label>品名</label>
        <div class="chip-row" id="drinkChips">
          ${PRESET_DRINKS.map(p => `<button type="button" class="chip" data-name="${p.name}">${p.name}</button>`).join('')}
        </div>
        <input type="text" id="nameInput" placeholder="品名を入力（例：炭酸水）" value="${existing ? escapeHtml(existing.name) : ''}">
      </div>
      <div class="field">
        <label>本数</label>
        <input type="number" id="qtyInput" min="1" step="1" value="${existing && existing.qty ? existing.qty : 1}">
      </div>
      <div class="field">
        <label>保管場所</label>
        <div class="chip-row" id="placeChips">
          ${PRESET_PLACES.map(p => `<button type="button" class="chip" data-place="${p}">${p}</button>`).join('')}
        </div>
        <input type="text" id="placeInput" placeholder="保管場所を入力" value="${existing ? escapeHtml(existing.place || '') : ''}">
      </div>
      <div class="field">
        <label>購入者</label>
        <input type="text" id="buyerInput" placeholder="購入者を入力" value="${existing ? escapeHtml(existing.buyer || '') : ''}">
      </div>
      <div class="field">
        <label>賞味期限</label>
        <input type="date" id="expiryInput" value="${existing ? existing.expiry : ''}">
      </div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="cancelBtn">やめる</button>
        <button class="btn btn-primary" id="saveBtn">${existing ? '更新する' : '追加する'}</button>
      </div>
    `;

    sheet.querySelectorAll('#drinkChips .chip').forEach(chip=>{
      if(existing && existing.name === chip.dataset.name) chip.classList.add('selected');
      chip.addEventListener('click', ()=>{
        sheet.querySelectorAll('#drinkChips .chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        document.getElementById('nameInput').value = chip.dataset.name;
      });
    });
    sheet.querySelectorAll('#placeChips .chip').forEach(chip=>{
      if(existing && existing.place === chip.dataset.place) chip.classList.add('selected');
      chip.addEventListener('click', ()=>{
        sheet.querySelectorAll('#placeChips .chip').forEach(c=>c.classList.remove('selected'));
        chip.classList.add('selected');
        document.getElementById('placeInput').value = chip.dataset.place;
      });
    });

    document.getElementById('cancelBtn').addEventListener('click', closeSheet);
    document.getElementById('saveBtn').addEventListener('click', handleSave);

    overlay.classList.add('show');
    sheet.classList.add('show');
  }

  async function handleSave(){
    const name = document.getElementById('nameInput').value.trim();
    const place = document.getElementById('placeInput').value.trim();
    const buyer = document.getElementById('buyerInput').value.trim();
    const expiry = document.getElementById('expiryInput').value;
    let qty = parseInt(document.getElementById('qtyInput').value, 10);
    if(!qty || qty < 1) qty = 1;

    if(!name){ showToast('品名を入力してね'); return; }
    if(!expiry){ showToast('賞味期限を入力してね'); return; }

    const wasEditing = !!editingId;
    const editId = editingId;
    const ok = await syncChange(()=>{
      const item = wasEditing ? drinks.find(d => d.id === editId) : null;
      if(item){
        Object.assign(item, { name, place, buyer, expiry, qty });
      }else{
        drinks.push({ id: wasEditing ? editId : uid(), name, place, buyer, expiry, qty });
      }
    });
    closeSheet();
    render();
    showToast(ok ? (wasEditing ? '更新したよ' : '追加したよ') : errMsg('保存できなかったよ'));
  }

  function askDelete(id){
    pendingDeleteId = id;
    const item = drinks.find(d => d.id === id);
    sheet.innerHTML = `
      <div class="confirm-box">
        <span style="font-size:32px;">🗑️</span>
        <p>「${escapeHtml(item ? item.name : '')}」を<br>削除してもいい？</p>
        <div class="row">
          <button class="btn btn-secondary" id="cancelDel">やめる</button>
          <button class="btn btn-primary" id="confirmDel" style="background:var(--coral-dark)">削除する</button>
        </div>
      </div>
    `;
    document.getElementById('cancelDel').addEventListener('click', closeSheet);
    document.getElementById('confirmDel').addEventListener('click', doDelete);
    overlay.classList.add('show');
    sheet.classList.add('show');
  }

  async function doDelete(){
    const id = pendingDeleteId;
    const ok = await syncChange(()=>{
      drinks = drinks.filter(d => d.id !== id);
    });
    closeSheet();
    render();
    showToast(ok ? '削除したよ' : errMsg('削除できなかったよ'));
  }

  overlay.addEventListener('click', closeSheet);

  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState === 'visible' && pantryId){
      await loadDrinks();
      render();
    }
  });

  (async function init(){
    try{
      const urlParams = new URLSearchParams(window.location.search);
      const urlPid = urlParams.get('pid');
      if(urlPid){
        pantryId = urlPid;
        try{ window.localStorage.setItem(PANTRY_KEY, pantryId); }catch(e){}
      }else{
        pantryId = window.localStorage.getItem(PANTRY_KEY);
      }
    }catch(e){ pantryId = null; }
    if(!pantryId){
      renderSetup();
    }else{
      syncUrlWithPantryId();
      await loadDrinksWithRetry();
      render();
    }
  })();

})();
</script>
</body>
</html>
